# ════════════════════════════════════════════════════════════════════════════
# SciTracer — runtime configuration
#
# All values here are defaults; any flag passed on the CLI overrides them.
# Section names map to pipeline stages.
# ════════════════════════════════════════════════════════════════════════════


# ── Language model ────────────────────────────────────────────────────────────
[lm]
# Provider priority when multiple API keys are present:
#   anthropic | openai | mistral | gemini | ollama
provider_priority = anthropic, openai, mistral, gemini, ollama

# Model name overrides (leave empty to use the built-in default per provider).
anthropic_model  = anthropic/claude-sonnet-4-6
openai_model     = openai/gpt-4o
mistral_model    = mistral/mistral-small-latest
gemini_model     = gemini/gemini-2.0-flash-001
ollama_model     = ollama/llama3.2
ollama_base_url  = http://localhost:11434

# DSPy generation parameters (applied globally to all ChainOfThought modules).
temperature      = 0.7
max_tokens       = 4096


# ── Formal verification ───────────────────────────────────────────────────────
[verification]
# Backend: z3 | lean
backend          = z3

# Maximum verify → refine → re-verify iterations before accepting best plan.
max_retries      = 3

# Run agent-based verification in addition to Kripke/Z3.
# When z3/lean are fully unavailable (all results errored) agent becomes the
# primary gate regardless of this flag.
agent_verify     = true

# Run the optional FOL / chain-entailment / type-consistency checks.
run_optional     = false


# ── Research plan synthesis ───────────────────────────────────────────────────
[planner]
# lats | lats-rag | default | rhea | rhea-rag
# lats is the default: LLM decides plan steps and branching via MCTS
backend          = lats

# Task decomposition applied after planning.
# none — let LATS own the structure (recommended with lats/lats-rag)
# tree | htn — apply additional decomposition on top of the planner output
decompose        = none


# ── LATS (Language Agent Tree Search) ────────────────────────────────────────
[lats]
# Maximum branch depth in the LATS search tree.
max_depth        = 6

# Branching factor: LLM candidates generated per expansion step.
n_candidates     = 3

# Total SELECT→EXPAND→EVALUATE→BACKPROP rollout budget.
max_rollouts     = 30

# UCT exploration constant c  (√2 ≈ 1.41).
exploration_weight = 1.41

# Node value threshold above which a FINISH[...] action is accepted as solved.
value_threshold  = 0.8

# Nodes with value below this threshold trigger a reflection step.
reflection_threshold = 0.3


# ── RHEA (Rolling Horizon Evolutionary Algorithm) ────────────────────────────
[rhea]
# Number of chromosomes P in the population.
population_size      = 8

# Action sequence length H (plan horizon).
horizon              = 6

# Maximum number of evolutionary generations.
n_generations        = 10

# Per-gene mutation probability.
mutation_rate        = 0.3

# Crossover probability between parent pairs.
crossover_rate       = 0.5

# Fraction of top chromosomes kept as elite each generation.
elite_fraction       = 0.25

# Fitness threshold above which the rolling horizon commits a_0.
commit_threshold     = 0.8

# Top-K actions retrieved from the action buffer per mutation locus.
top_k_actions        = 8


# ── Hierarchical decomposition ────────────────────────────────────────────────
[decomposition]
# StepDecomposer (tree mode): atomicity-driven termination, no artificial depth cap.
# tree_max_depth is ignored — the LLM atomicity check determines termination.

# HTNDecomposer: hard cap on total primitive tasks (safety ceiling only).
htn_hard_cap     = 20


# ── Literature collection ─────────────────────────────────────────────────────
[literature]
# Number of ArXiv results to retrieve per query.
arxiv_n          = 10

# Number of Semantic Scholar / Google Scholar results per query.
scholar_n        = 10

# Local folder to read papers from instead of searching online (overrides search).
# Leave empty to use online search.
local_path       =

# Session pickle file for caching literature + trajectories across runs.
# Use 'auto' to auto-generate the path from the question hash.
# Leave empty to disable caching.
session_file     =


# ── RAG / retrieval ───────────────────────────────────────────────────────────
[rag]
# Disable all RAG/literature retrieval; formalize the question directly.
no_rag           = false

# Maximum knowledge-graph triples returned per retrieval call.
max_graph_triples = 40

# Number of trajectory vector DB results used as plan context.
trajectory_context_n = 2


# ── Neo4j (ontology graph store) ─────────────────────────────────────────────
[neo4j]
# Leave uri empty to disable Neo4j; the pipeline continues without it.
uri      =
user     = neo4j
password =


# ── Logging ──────────────────────────────────────────────────────────────────
[logging]
# Directory where per-run log files are written (logs/scitracer_<timestamp>.log).
log_dir          = logs


# ── Output / paths ───────────────────────────────────────────────────────────
[output]
# Directory for generated executor scripts.
tasks_dir        = tasks

# Markdown plan output path.
plan_md          = plan.md

# Python executor script output path.
plan_py          = plan_exec.py

# Results directory for benchmark runs.
results_dir      = results


# ── AST formalization (alternative to Kripke) ────────────────────────────────
[ast]
# Use AST formalization path instead of Kripke verification.
enabled          = false


# ── Benchmark runner (bench_main.py) ─────────────────────────────────────────
[benchmark]
# Number of problems to evaluate (0 = all).
n                = 0

# Filter by subject tag (empty = all subjects).
subject          =

# Dataset split to load.
split            = test

# Run with formal logic verification pass.
logic_verification = false

# Resume from an existing partial results file.
resume           =
